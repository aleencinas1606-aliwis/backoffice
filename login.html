<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Web Final</title>
    <script type="module" src="login.js"></script>
    <link rel="stylesheet" href="elcss.css">
</head>
<body>

    <h1>PROYECTO WEB FINAL</h1>

    <form id="login-form">
        <h2>Iniciar Sesion</h2>
        <p class="subtitulo">Ingresa tus datos para administrar tu portafolio</p>

        <div class="ot4input">
            <label for="email">Correo Electronico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="ot4input">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="btn-enviar">Entrar</button>

        <p class="nav-auth">
            ¿Aun no tienes cuenta? <a href="registro.html">Registrate aqui</a>
        </p>
    </form>
</body>
</html>
