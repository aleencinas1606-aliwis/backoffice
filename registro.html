<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Proyecto Web Final</title>
    <link rel="stylesheet" href="elcss.css">
</head>
<body>

    <h1>PROYECTO WEB FINAL</h1>

    <form id="register-form">
        <h2>Crear Cuenta</h2>
        <p class="subtitulo">Registrate para acceder al panel de mis proyectos</p>

        <div class="ot4input">
            <label for="username">Nombre Completo</label>
            <input type="text" id="username" name="username" placeholder="Tu nombre (min. 6 caracteres)" minlength="6" required>
        </div>

        <div class="ot4input">
            <label for="email">Correo Electronico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="ot4input">
            <label for="itsonid">ID ITSON</label>
            <input type="text" id="itsonid" name="itsonid" placeholder="Ej. 216578" pattern="\d{6}" maxlength="6" onkeypress="return /[0-9]/i.test(event.key)" title="Debe contener 6 digitos numericos" required>
        </div>

        <div class="ot4input">
            <label for="password">Contrasena</label>
            <input type="password" id="password" name="password" placeholder="Minimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" id="btn-enviar">Registrarme</button>

        <p class="nav-auth">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesion aqui...</a>
        </p>
    </form>

    <script type="module" src="registro.js"></script>
</body>
</html>
