<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Proyecto Web Final</title>
    <link rel="stylesheet" href="elcss.css">
    <script type="module" src="index.js"></script>
</head>
<body class="home-body">

    <header class="home-header">
        <h1>PROYECTO WEB FINAL</h1>
        <button id="logout-btn" class="btn-secundario">Cerrar Sesion</button>
    </header>

    <main class="home-main">
        <div class="tarjeta-bp" id="intro">
            <h2>Panel Backoffice</h2>
            <p class="subtitulo">Administra los proyectos de tu portafolio desde aqui</p>
        </div>

        <form id="create-project" class="tarjeta-bp">
            <h2>Crear Proyecto</h2>
            <p class="subtitulo">Registra un nuevo proyecto en tu portafolio</p>

            <div class="ot4input">
                <label for="name">Nombre:</label>
                <input id="name" name="name" type="text" placeholder="Nombre del proyecto" required>
            </div>
            
            <div class="ot4input">
                <label for="description">Descripcion:</label>
                <input id="description" name="description" type="text" placeholder="Breve descripcion" required>
            </div>
            
            <div class="ot4input">
                <label for="technologies">Tecnologias (una por linea):</label>
                <textarea id="technologies" name="technologies" placeholder="HTML&#10;CSS&#10;JavaScript" required></textarea>
            </div>
            
            <div class="ot4input">
                <label for="repository">Repositorio:</label>
                <input id="repository" name="repository" type="text" placeholder="https://github.com..." required>
            </div>
            
            <div class="ot4input">
                <label for="image">Imagen (URL):</label>
                <input id="image" name="image" type="text" placeholder="https://..." required>
            </div>
            
            <button type="submit" id="btn-enviar">Guardar</button>
        </form>  
                
        <h2 class="titulo-seccion">Proyectos Registrados</h2>
        
        <div id="my-projects">
        
        </div>
    </main>

</body>
</html>
